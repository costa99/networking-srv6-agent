[metadata]
name = networking-srv6-agent
summary = SRv6 connectivity and traffic engineering for OpenStack Neutron
description_file = README.rst
license = Apache-2.0
python_requires = >=3.9
classifiers =
    Environment :: OpenStack
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3

[options]
packages = networking_srv6_agent

# NOTE: keep this section intact. The networking-bgpvpn checkout lost its
# entry_points and the only surviving copy was the installed dist -- losing
# neutron.policies in particular denies every API call, because oslo.policy
# fails closed on a rule it never registered.
[entry_points]
# Only entry points whose targets EXIST are live. The rest are commented and
# get uncommented by the phase that creates them (MIGRATION-PLAN.md section 5).
#
# This is a safety measure, not tidiness: an entry point pointing at a missing
# module does not fail quietly. `service_plugins = srv6` with no plugin class
# stops neutron-server from starting, and the traceback names an ImportError
# rather than saying the feature is half-built.

oslo.config.opts =
    networking-srv6-agent = networking_srv6_agent.common.config:list_opts

