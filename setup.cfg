[metadata]
name = networking-srv6-agent
summary = SRv6 connectivity and traffic engineering for OpenStack Neutron
description_file = README.rst
license = Apache-2.0
python_requires = >=3.9
classifiers =
    Environment :: OpenStack
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3

[options]
packages = networking_srv6_agent

# NOTE: keep this section intact. The networking-bgpvpn checkout lost its
# entry_points and the only surviving copy was the installed dist -- losing
# neutron.policies in particular denies every API call, because oslo.policy
# fails closed on a rule it never registered.
[entry_points]
neutron.service_plugins =
    srv6 = networking_srv6_agent.services.plugin:Srv6Plugin
neutron.agent.l2.extensions =
    srv6 = networking_srv6_agent.agent.agent_extension:Srv6AgentExtension
neutron.db.alembic_migrations =
    networking-srv6-agent = networking_srv6_agent.db.migration:alembic_migrations
neutron.policies =
    networking-srv6-agent = networking_srv6_agent.policies:list_rules
oslo.policy.policies =
    networking-srv6-agent = networking_srv6_agent.policies:list_rules
oslo.config.opts =
    networking-srv6-agent = networking_srv6_agent.common.config:list_opts
