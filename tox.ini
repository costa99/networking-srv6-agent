[tox]
envlist = py3,pep8
minversion = 4.0
skipsdist = False

[testenv]
usedevelop = True
setenv =
    OS_TEST_PATH=./networking_srv6_agent/tests/unit
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/test-requirements.txt
commands = stestr run {posargs}

[testenv:dashboard]
# The Horizon plugin's tests (FEATURE-HORIZON-DASHBOARD §7): Django's test
# runner, which needs Horizon, not neutron. So the env does not install this
# package (that would pull in neutron through requirements.txt) and puts
# the source tree on the path instead. Horizon's master is not on PyPI: it
# comes from git, under the same constraints file as OpenStack's CI.
skip_install = True
setenv =
    PYTHONPATH={toxinidir}
deps =
    -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
    horizon @ git+https://opendev.org/openstack/horizon@master
commands = python tools/django-manage.py test srv6_dashboard {posargs}

[testenv:pep8]
commands = flake8 {posargs}

[flake8]
# E126/E128 continuation-line rules disagree with the surrounding neutron style
ignore = E126,E128,W503,W504
show-source = True
exclude = .git,.tox,dist,build,__pycache__,*.egg-info
max-line-length = 79
