<script>
/*
 * SRv6 topology: draws what data/ returns (srv6_topology/topology.py).
 * Plain DOM and SVG, no library. Every string from the API
 * goes in through textContent or setAttribute, never innerHTML.
 *
 *   - with link states (an underlay topology on the server), nodes sit in
 *     rows by tier: hosts at the bottom, leaves above, spines on top;
 *     without, hosts sit on a circle, in the API's (sorted) order;
 *   - each directed underlay link is a thin line, the two directions of a
 *     link side by side, coloured by its level (load share of capacity,
 *     down, or unknown when stale); hover for the figures;
 *   - each domain present on a host is a coloured badge under it, with
 *     its VM count;
 *   - each TE path is a line from its first waypoint (or from its source
 *     host, for a path limited to one ingress), hop by hop, to its
 *     destination, green when ACTIVE and dashed amber when DEGRADED;
 *     paths sharing a hop are drawn side by side, not on top of each
 *     other;
 *   - the Domain select shows one domain's badges and paths only;
 *   - data/ is fetched again every 5 s: the link state is live.
 */
(function () {
  'use strict';
  var root = document.getElementById('srv6-topology');
  if (!root) { return; }

  var SVG_NS = 'http://www.w3.org/2000/svg';
  var COLORS = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd',
                '#8c564b', '#e377c2', '#17becf'];
  var STATUS_COLOR = {ACTIVE: '#3c763d', DEGRADED: '#f0ad4e'};
  /* Not green/amber: those are the TE paths' colours. */
  var LEVEL_COLOR = {ok: '#6baed6', busy: '#fd8d3c', congested: '#d62728',
                     down: '#333', unknown: '#bbb'};
  var LINK_GAP = 7, REFRESH_MS = 5000;
  var W = 900, H = 520, CX = W / 2, CY = H / 2 - 10, RADIUS = 175;
  /* the largest circle whose boxes and badges still fit the canvas */
  var RADIUS_MAX = 215;
  var NODE_W = 170, NODE_H = 54, BADGE_R = 11, PATH_GAP = 9;
  var nodeW = NODE_W;   /* narrower when a tier row holds many nodes */

  var svg = document.getElementById('srv6-topology-svg');
  var select = document.getElementById('srv6-topology-domain');
  var legend = document.getElementById('srv6-topology-legend');
  var pathRows = document.getElementById('srv6-topology-paths');
  var linkRows = document.getElementById('srv6-topology-links');
  var errorBox = document.getElementById('srv6-topology-error');
  var data = null;
  var domainColor = {};
  var domainName = {};

  function svgEl(name, attrs, parent) {
    var node = document.createElementNS(SVG_NS, name);
    Object.keys(attrs || {}).forEach(function (k) {
      node.setAttribute(k, attrs[k]);
    });
    if (parent) { parent.appendChild(node); }
    return node;
  }

  function htmlEl(tag, text, parent, attrs) {
    var node = document.createElement(tag);
    if (text !== undefined && text !== null) { node.textContent = text; }
    Object.keys(attrs || {}).forEach(function (k) {
      node.setAttribute(k, attrs[k]);
    });
    if (parent) { parent.appendChild(node); }
    return node;
  }

  function clear(node) {
    while (node.firstChild) { node.removeChild(node.firstChild); }
  }

  /* With an underlay: one row per tier (build() computed them), the
     highest tier on top, nodes spread evenly in API order. */
  function tieredLayout(hosts) {
    var pos = {}, rows = {}, top = 0;
    hosts.forEach(function (h) {
      (rows[h.tier] = rows[h.tier] || []).push(h);
      top = Math.max(top, h.tier);
    });
    var widest = Math.max.apply(null, Object.keys(rows).map(function (t) {
      return rows[t].length;
    }));
    nodeW = Math.min(NODE_W, W / widest - 12);
    Object.keys(rows).forEach(function (t) {
      var row = rows[t];
      var y = top ? 60 + (H - 150) * (top - t) / top : CY;
      row.forEach(function (h, i) {
        pos[h.host] = {x: W * (i + 0.5) / row.length, y: y};
      });
    });
    return pos;
  }

  /* Host centres on a circle, the first at the top; one host sits in the
     middle, two side by side. The circle grows until neighbouring boxes
     no longer overlap, up to RADIUS_MAX; past that the boxes narrow. */
  function layout(hosts) {
    var pos = {};
    var n = hosts.length;
    /* Neighbours' centres are r * chord apart; two boxes clear each other
       when that is at least hypot(box width, box height). */
    var chord = n > 2 ? 2 * Math.sin(Math.PI / n) : 2;
    var r = Math.min(RADIUS_MAX,
                     Math.max(RADIUS, Math.hypot(NODE_W + 4, NODE_H) / chord));
    /* shortcut: from 21 hosts the boxes overlap again (40 px minimum);
       use a topology_file (tier layout) for clouds that large. */
    nodeW = Math.max(40, Math.min(
      NODE_W, Math.sqrt(Math.max(0, Math.pow(r * chord, 2) -
                                    NODE_H * NODE_H)) - 4));
    hosts.forEach(function (h, i) {
      if (n === 1) {
        pos[h.host] = {x: CX, y: CY};
      } else {
        var a = -Math.PI / 2 + 2 * Math.PI * i / n;
        if (n === 2) { a = Math.PI * i; }
        pos[h.host] = {x: CX + r * Math.cos(a),
                       y: CY + r * Math.sin(a)};
      }
    });
    return pos;
  }

  /* Where the segment from a to b leaves a's box: lines stop at the box
     edge, so arrowheads stay visible. */
  function edgePoint(a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var t = Math.min(dx ? (nodeW / 2 + 4) / Math.abs(dx) : Infinity,
                     dy ? (NODE_H / 2 + 4) / Math.abs(dy) : Infinity);
    return {x: a.x + dx * t, y: a.y + dy * t};
  }

  function defs() {
    var d = svgEl('defs', {}, svg);
    Object.keys(STATUS_COLOR).forEach(function (status) {
      var m = svgEl('marker', {id: 'srv6-arrow-' + status, viewBox: '0 0 10 10',
                               refX: 9, refY: 5, markerWidth: 7,
                               markerHeight: 7, orient: 'auto'}, d);
      svgEl('path', {d: 'M0,0 L10,5 L0,10 z',
                     fill: STATUS_COLOR[status]}, m);
    });
  }

  /* An unordered hop pair, the key paths sharing a hop are counted by. */
  function pairKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

  /* For each hop pair, the indices of the paths that use it, in order. */
  function pairSlots(paths) {
    var slots = {};
    paths.forEach(function (p, k) {
      for (var i = 0; i + 1 < p.hops.length; i++) {
        var s = slots[pairKey(p.hops[i], p.hops[i + 1])] =
          slots[pairKey(p.hops[i], p.hops[i + 1])] || [];
        if (s.indexOf(k) < 0) { s.push(k); }
      }
    });
    return slots;
  }

  function drawPath(path, k, slots, pos) {
    var color = STATUS_COLOR[path.status] || '#777';
    var g = svgEl('g', {'class': 'srv6-te-path', style: 'cursor: pointer'},
                  svg);
    svgEl('title', {}, g).textContent =
      (domainName[path.domain_id] || path.domain_id) + ': ' +
      path.hops.join(' → ') + ' (' + path.status + ')';
    g.addEventListener('click', function () {
      window.location.href = path.url;
    });
    for (var i = 0; i + 1 < path.hops.length; i++) {
      var ha = path.hops[i], hb = path.hops[i + 1];
      var a = pos[ha], b = pos[hb];
      if (!a || !b || a === b) { continue; }
      /* Side by side only with the paths on this same hop pair; the sign
         keeps a path on its side whichever way it runs the pair. */
      var s = slots[pairKey(ha, hb)];
      var offset = (s.indexOf(k) - (s.length - 1) / 2) * PATH_GAP;
      if (ha > hb) { offset = -offset; }
      var len = Math.hypot(b.x - a.x, b.y - a.y);
      var ox = -(b.y - a.y) / len * offset, oy = (b.x - a.x) / len * offset;
      var p1 = edgePoint({x: a.x + ox, y: a.y + oy},
                         {x: b.x + ox, y: b.y + oy});
      var p2 = edgePoint({x: b.x + ox, y: b.y + oy},
                         {x: a.x + ox, y: a.y + oy});
      var attrs = {x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, stroke: color,
                   'stroke-width': 3};
      if (path.status !== 'ACTIVE') { attrs['stroke-dasharray'] = '7 5'; }
      if (i + 2 === path.hops.length && STATUS_COLOR[path.status]) {
        attrs['marker-end'] = 'url(#srv6-arrow-' + path.status + ')';
      }
      svgEl('line', attrs, g);
    }
  }

  /* One direction of a link: offset to the right of its direction, so
     a->b and b->a sit side by side. */
  function drawLink(link, pos) {
    var a = pos[link.from], b = pos[link.to];
    if (!a || !b) { return; }
    var len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    var ox = -(b.y - a.y) / len * LINK_GAP / 2;
    var oy = (b.x - a.x) / len * LINK_GAP / 2;
    var p1 = edgePoint({x: a.x + ox, y: a.y + oy}, {x: b.x + ox, y: b.y + oy});
    var p2 = edgePoint({x: b.x + ox, y: b.y + oy}, {x: a.x + ox, y: a.y + oy});
    var attrs = {x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
                 stroke: LEVEL_COLOR[link.level], 'stroke-width': 4};
    if (link.level === 'down') { attrs['stroke-dasharray'] = '4 3'; }
    var g = svgEl('g', {'class': 'srv6-link'}, svg);
    svgEl('title', {}, g).textContent = linkText(link);
    svgEl('line', attrs, g);
  }

  function fmt(v, unit) {
    return v === null || v === undefined ? '–' : String(v) + (unit || '');
  }

  function linkText(link) {
    return link.from + ' → ' + link.to + ': ' +
      (link.level === 'down' ? 'DOWN, ' : '') +
      fmt(link.mbps) + ' of ' + fmt(link.capacity_mbps, ' Mbit/s') +
      (link.load === null ? '' : ' (' + Math.round(100 * link.load) + ' %)') +
      ', delivered ' + fmt(link.delivered_mbps) +
      ', peak ' + fmt(link.peak_mbps) +
      (link.stale ? ', stale' : ', ' + fmt(link.age, ' s') + ' old');
  }

  function drawHost(host, pos, domains) {
    var p = pos[host.host];
    var g = svgEl('g', {'class': 'srv6-host'}, svg);
    var box = {x: p.x - nodeW / 2, y: p.y - NODE_H / 2, width: nodeW,
               height: NODE_H, rx: 6, fill: '#fff', stroke: '#555',
               'stroke-width': 1.5};
    if (host.fabric) {
      box.fill = '#f5f5f5';
      box.stroke = '#999';
    } else if (!host.locator) {
      box.stroke = '#a94442';
      box['stroke-dasharray'] = '5 4';
    }
    svgEl('rect', box, g);
    svgEl('text', {x: p.x, y: p.y - 6, 'text-anchor': 'middle',
                   'font-weight': 'bold', 'font-size': 14}, g)
      .textContent = host.host;
    svgEl('text', {x: p.x, y: p.y + 14, 'text-anchor': 'middle',
                   'font-family': 'monospace', 'font-size': 12,
                   fill: host.locator || host.fabric ? '#333' : '#a94442'}, g)
      .textContent = host.locator || (host.fabric ? 'fabric' : 'no locator');
    var present = domains.filter(function (d) {
      return d.hosts[host.host];
    });
    present.forEach(function (d, i) {
      var bx = p.x + (i - (present.length - 1) / 2) * (2 * BADGE_R + 4);
      var by = p.y + NODE_H / 2 + BADGE_R + 4;
      var b = svgEl('g', {}, g);
      svgEl('title', {}, b).textContent =
        d.name + ': ' + d.hosts[host.host] + ' VM(s) on ' + host.host;
      svgEl('circle', {cx: bx, cy: by, r: BADGE_R,
                       fill: domainColor[d.id]}, b);
      svgEl('text', {x: bx, y: by + 4, 'text-anchor': 'middle',
                     'font-size': 11, fill: '#fff'}, b)
        .textContent = String(d.hosts[host.host]);
    });
  }

  function drawLegend(domains) {
    clear(legend);
    domains.forEach(function (d) {
      var item = htmlEl('span', null, legend,
                        {style: 'margin-right: 1.5em; white-space: nowrap'});
      htmlEl('span', '● ', item, {style: 'color: ' + domainColor[d.id]});
      htmlEl('span', d.name + ' (' + d.networks + ' network' +
             (d.networks === 1 ? '' : 's') + ')', item);
    });
    var st = htmlEl('span', null, legend, {style: 'white-space: nowrap'});
    htmlEl('span', '— ACTIVE ', st,
           {style: 'color: ' + STATUS_COLOR.ACTIVE});
    htmlEl('span', '- - DEGRADED', st,
           {style: 'color: ' + STATUS_COLOR.DEGRADED});
    if (!data.links.length) { return; }
    var busy = Math.round(data.levels.busy * 100);
    var high = Math.round(data.levels.congested * 100);
    var LEVEL_TEXT = {ok: 'below ' + busy + ' %',
                      busy: busy + '–' + high + ' %',
                      congested: '≥ ' + high + ' %',
                      down: 'down', unknown: 'no fresh data'};
    var lk = htmlEl('div', 'Links (share of capacity): ', legend);
    Object.keys(LEVEL_COLOR).forEach(function (level) {
      var item = htmlEl('span', null, lk,
                        {style: 'margin-right: 1.2em; white-space: nowrap'});
      htmlEl('span', '▬ ', item, {style: 'color: ' + LEVEL_COLOR[level]});
      htmlEl('span', LEVEL_TEXT[level], item);
    });
  }

  function fillLinkTable(links) {
    clear(linkRows);
    if (!links.length) {
      var tr0 = htmlEl('tr', null, linkRows);
      htmlEl('td', 'No link state: the server has no topology_file.', tr0,
             {colspan: 7});
      return;
    }
    links.forEach(function (link) {
      var tr = htmlEl('tr', null, linkRows);
      var td = htmlEl('td', null, tr);
      htmlEl('span', '▬ ', td, {style: 'color: ' + LEVEL_COLOR[link.level]});
      htmlEl('span', link.from + ' → ' + link.to, td);
      htmlEl('td', link.load === null ? '–' :
             Math.round(100 * link.load) + ' %', tr);
      htmlEl('td', fmt(link.mbps), tr);
      htmlEl('td', fmt(link.capacity_mbps), tr);
      htmlEl('td', fmt(link.delivered_mbps), tr);
      htmlEl('td', fmt(link.peak_mbps), tr);
      htmlEl('td', link.level === 'down' ? 'down' :
             link.stale ? 'stale' : fmt(link.age, ' s'), tr);
    });
  }

  function fillPathTable(paths) {
    clear(pathRows);
    if (!paths.length) {
      var tr0 = htmlEl('tr', null, pathRows);
      htmlEl('td', 'No TE paths.', tr0, {colspan: 3});
      return;
    }
    paths.forEach(function (path) {
      var tr = htmlEl('tr', null, pathRows);
      var td = htmlEl('td', null, tr);
      htmlEl('span', '● ', td,
             {style: 'color: ' + (domainColor[path.domain_id] || '#777')});
      htmlEl('span', domainName[path.domain_id] || path.domain_id, td);
      var route = htmlEl('td', null, tr);
      var text = (path.source ? 'from ' + path.source + ' ' : '') +
                 (path.via.length ? 'via ' + path.via.join(' → ') +
                  ' to ' : 'direct to ') + path.destination;
      htmlEl('a', text, route, {href: path.url});
      htmlEl('td', path.status, tr);
    });
  }

  function render() {
    clear(svg);
    defs();
    var only = select.value;
    var domains = data.domains.filter(function (d) {
      return !only || d.id === only;
    });
    var paths = data.te_paths.filter(function (p) {
      return !only || p.domain_id === only;
    });
    var pos = data.links.length ? tieredLayout(data.hosts)
                                : layout(data.hosts);
    if (!data.hosts.length) {
      svgEl('text', {x: CX, y: CY, 'text-anchor': 'middle'}, svg)
        .textContent = 'No host has registered an SRv6 locator.';
    }
    /* Links, then paths, then the hosts: boxes and labels stay readable. */
    data.links.forEach(function (l) { drawLink(l, pos); });
    var drawn = paths.filter(function (p) { return p.hops.length > 1; });
    var slots = pairSlots(drawn);
    drawn.forEach(function (p, k) { drawPath(p, k, slots, pos); });
    data.hosts.forEach(function (h) { drawHost(h, pos, domains); });
    drawLegend(domains);
    fillPathTable(paths);
    fillLinkTable(data.links);
  }

  function showError(message) {
    errorBox.textContent = 'Unable to load the SRv6 topology: ' + message;
    errorBox.hidden = false;
  }

  /* First load builds the Domain select; later loads (every 5 s) only
     redraw. A failed reload keeps the last picture and shows the error. */
  function load() {
    return fetch(root.getAttribute('data-url'),
                 {credentials: 'same-origin',
                  headers: {Accept: 'application/json'}})
      .then(function (response) {
        return response.json().then(function (body) {
          if (!response.ok) {
            throw new Error(body.error || response.statusText);
          }
          return body;
        });
      })
      .then(function (body) {
        var first = data === null;
        data = body;
        data.links = data.links || [];
        data.domains.forEach(function (d, i) {
          if (domainColor[d.id]) { return; }
          domainColor[d.id] = COLORS[Object.keys(domainColor).length %
                                     COLORS.length];
          domainName[d.id] = d.name;
          htmlEl('option', d.name, select, {value: d.id});
        });
        if (first) { select.addEventListener('change', render); }
        errorBox.hidden = true;
        render();
      })
      .catch(function (err) { showError(err.message); });
  }

  load().then(function () { window.setInterval(load, REFRESH_MS); });
})();
</script>
